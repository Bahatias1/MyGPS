<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Élève - ScholaGuard Maternelle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-container">
        <a href="afficherEnfants.html" class="logo">
            <span>🏫 ScholaGuard</span>
            <span class="logo-badge">ÉCOLE MATERNELLE</span>
        </a>
        <nav>
            <a href="enregistrerEnfant.html" class="active btn-nav-accent">+ Inscrire Élève</a>
            <a href="afficherEnfants.html">Registre Élèves</a>
            <a href="index.html">Déconnexion</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <div class="form-card-wrapper">
        <div class="card-minimal">
            <div class="form-header">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎒</div>
                <h2>Fiche d'Inscription Élève</h2>
                <p>Enregistrez l'élève et associez son bracelet GPS de surveillance</p>
            </div>

            <div id="errorMsg" class="alert alert-error" style="display: none;"></div>
            <div id="successMsg" class="alert alert-success" style="display: none;"></div>

            <form id="childForm">
                <div class="form-group">
                    <label for="nom">Nom de l'élève</label>
                    <input type="text" id="nom" name="nom" placeholder="Ex: Mussa" required>
                </div>

                <div class="form-group">
                    <label for="postNom">Post-Nom</label>
                    <input type="text" id="postNom" name="postNom" placeholder="Ex: Erickson" required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom de l'élève</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Ex: Erick" required>
                </div>

                <div class="form-group">
                    <label for="age">Âge de l'enfant (Ans)</label>
                    <input type="number" id="age" name="age" min="2" max="6" placeholder="Ex: 4" required>
                </div>

                <div class="form-group">
                    <label for="classe">Section Maternelle</label>
                    <select id="classe" name="classe" required>
                        <option value="Toute Petite Section (TPS)">Toute Petite Section (TPS - 2 à 3 ans)</option>
                        <option value="Petite Section (PS)" selected>Petite Section (PS - 3 à 4 ans)</option>
                        <option value="Moyenne Section (MS)">Moyenne Section (MS - 4 à 5 ans)</option>
                        <option value="Grande Section (GS)">Grande Section (GS - 5 à 6 ans)</option>
                    </select>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-primary" id="btnSubmit">
                        <span>Inscrire l'élève & Activer le Bracelet 🛰️</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    document.getElementById('childForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const nom = document.getElementById('nom').value;
        const postNom = document.getElementById('postNom').value;
        const prenom = document.getElementById('prenom').value;
        const age = document.getElementById('age').value;
        const classe = document.getElementById('classe').value;

        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>Inscription en cours...</span>';

        try {
            const res = await fetch('/api/enregistrerEnfant', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom, postNom, prenom, age, classe, photo: 'default.jpg' })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                successMsg.style.display = 'flex';
                successMsg.textContent = 'Élève inscrit avec succès ! Redirection vers le registre...';
                setTimeout(() => window.location.href = 'afficherEnfants.html', 1500);
            } else {
                errorMsg.style.display = 'flex';
                errorMsg.textContent = data.message || "Erreur lors de l'enregistrement.";
            }
        } catch (err) {
            errorMsg.style.display = 'flex';
            errorMsg.textContent = 'Erreur serveur : ' + err.message;
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<span>Inscrire l\'élève & Activer le Bracelet 🛰️</span>';
        }
    });
</script>
</body>
</html>
