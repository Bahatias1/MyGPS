<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géolocalisation - Carte de Goma, RDC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map {
            height: 560px;
            width: 100%;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }
        .leaflet-container {
            background: #0f172a !important;
        }
        .info-card-minimal {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .dot {
            height: 10px;
            width: 10px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-alert {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.4);
        }
        .status-alert .dot {
            background-color: #ef4444;
        }
    </style>
</head>
<body>
<header>
    <div class="header-container">
        <a href="afficherEnfants.html" class="logo">
            <span>SYSLOC</span>
            <span class="logo-badge">GPS TRACKER</span>
        </a>
        <nav>
            <a href="enregistrerEnfant.html" class="btn-nav-accent">+ Ajouter Enfant</a>
            <a href="afficherEnfants.html">Mes Enfants</a>
            <a href="index.html">Déconnexion</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <div class="info-card-minimal" id="childDetails">
        <div>
            <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--text-main);">Détails de l'enfant</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Chargement des données du bracelet GPS...</p>
        </div>
        <div class="live-badge" id="liveBadge">
            <span class="dot"></span> Connexion au Bracelet GPS...
        </div>
    </div>

    <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const childId = urlParams.get('id') || 2;

    // Initialiser la carte Leaflet sur Goma
    const map = L.map('map').setView([-1.6585, 29.2203], 15);

    // Couche OpenStreetMap en Mode Sombre/Minimal
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    let currentMarker = null;
    let pathPolyline = null;
    let historyLayerGroup = L.layerGroup().addTo(map);
    let isFirstLoad = true;

    async function loadTrackingData() {
        try {
            const res = await fetch(`/api/localiser?id=${childId}`);
            const data = await res.json();

            const detailsDiv = document.getElementById('childDetails');
            const badgeDiv = document.getElementById('liveBadge');

            if (data.enfant) {
                detailsDiv.children[0].innerHTML = `
                    <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:1.5rem;font-weight:800;color:var(--text-main);margin:0;">Enfant suivi : ${data.enfant.prenom} ${data.enfant.nom} ${data.enfant.postNom || ''}</h2>
                    <p style="margin:5px 0 0 0;color:var(--text-muted);font-size:0.9rem;"><strong>Âge :</strong> ${data.enfant.age} ans | <strong>Classe :</strong> ${data.enfant.classe}</p>
                `;
            }

            if (data.positions && data.positions.length > 0) {
                // Filtrer les positions valides
                const validPositions = data.positions.filter(p => parseFloat(p.latitude) !== 0 && parseFloat(p.longitude) !== 0);
                const posList = validPositions.length > 0 ? validPositions : data.positions;

                // Toute dernière position reçue du bracelet
                const lastPos = posList[posList.length - 1];
                const isAlert = parseInt(lastPos.etat) === 1;

                // Badge d'état
                if (isAlert) {
                    badgeDiv.className = "live-badge status-alert";
                    badgeDiv.innerHTML = `<span class="dot"></span> ⚠️ ALERTE DANGER / BOUTON SOS PRESSÉ`;
                } else {
                    badgeDiv.className = "live-badge";
                    badgeDiv.innerHTML = `<span class="dot"></span> En Direct (${posList.length} positions enregistrées)`;
                }

                // 1. Points de passage historiques cliquables
                historyLayerGroup.clearLayers();
                const latLngs = [];

                posList.forEach((p, idx) => {
                    const lat = parseFloat(p.latitude);
                    const lng = parseFloat(p.longitude);
                    latLngs.push([lat, lng]);

                    if (idx < posList.length - 1) {
                        const circle = L.circleMarker([lat, lng], {
                            radius: 5,
                            fillColor: p.etat === 1 ? '#ef4444' : '#e11d48',
                            color: '#ffffff',
                            weight: 1,
                            opacity: 0.9,
                            fillOpacity: 0.8
                        });
                        circle.bindPopup(`
                            <div style="color:#0f172a;">
                                <strong>Étape ${idx + 1} / ${posList.length}</strong><br>
                                Lat: ${lat}<br>Lng: ${lng}<br>
                                Statut: ${p.etat === 1 ? '<span style="color:red;font-weight:bold;">SOS</span>' : '<span style="color:green;font-weight:bold;">Normal</span>'}
                            </div>
                        `);
                        historyLayerGroup.addLayer(circle);
                    }
                });

                // 2. Ligne de trajectoire (Polyline)
                if (pathPolyline) {
                    pathPolyline.setLatLngs(latLngs);
                } else {
                    pathPolyline = L.polyline(latLngs, {
                        color: '#e11d48',
                        weight: 4,
                        opacity: 0.85,
                        dashArray: '6, 6'
                    }).addTo(map);
                }

                // 3. Marqueur principal Position Actuelle
                const currentLatLng = [parseFloat(lastPos.latitude), parseFloat(lastPos.longitude)];

                if (currentMarker) {
                    currentMarker.setLatLng(currentLatLng);
                } else {
                    currentMarker = L.marker(currentLatLng).addTo(map);
                }

                currentMarker.bindPopup(`
                    <div style="text-align:center;color:#0f172a;">
                        <strong style="font-size:1.1em;color:#9f1239;">📍 Position Actuelle en Direct</strong><br>
                        <strong>Enfant :</strong> ${data.enfant ? data.enfant.prenom + ' ' + data.enfant.nom : ''}<br>
                        <strong>Lat :</strong> ${lastPos.latitude} | <strong>Lng :</strong> ${lastPos.longitude}<br>
                        <strong>Statut :</strong> ${isAlert ? '<span style="color:red;font-weight:bold;">⚠️ DANGER / SOS</span>' : '<span style="color:green;font-weight:bold;">🟢 Normal</span>'}
                    </div>
                `).openPopup();

                if (isFirstLoad) {
                    map.setView(currentLatLng, 16);
                    isFirstLoad = false;
                }
            }
        } catch (err) {
            console.error("Erreur de chargement des positions:", err);
        }
    }

    loadTrackingData();
    setInterval(loadTrackingData, 5000);
</script>
</body>
</html>
