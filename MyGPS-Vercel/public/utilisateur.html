<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Compte - ScholaGuard Maternelle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-container">
        <a href="index.html" class="logo">
            <span>🏫 ScholaGuard</span>
            <span class="logo-badge">ÉCOLE MATERNELLE</span>
        </a>
        <nav>
            <a href="index.html">Connexion</a>
            <a href="utilisateur.html" class="active">Créer un Compte</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <div class="form-card-wrapper">
        <div class="card-minimal">
            <div class="form-header">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔑</div>
                <h2>Créer un Compte Utilisateur</h2>
                <p>Espace Enseignants, Éducateurs, Direction & Parents d'Élèves</p>
            </div>

            <div id="errorMsg" class="alert alert-error" style="display: none;"></div>
            <div id="successMsg" class="alert alert-success" style="display: none;"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="role">Rôle / Profil d'accès</label>
                    <select id="role" name="role" required>
                        <option value="enseignant">Enseignant / Éducateur Maternelle</option>
                        <option value="direction">Direction / Administration Scolaire</option>
                        <option value="parent" selected>Parent d'Élève</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
                </div>

                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" placeholder="exemple@ecole-maternelle.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="motdepass">Mot de passe</label>
                    <input type="password" id="motdepass" name="motdepass" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="motdepassconfirm">Confirmer le mot de passe</label>
                    <input type="password" id="motdepassconfirm" name="motdepassconfirm" placeholder="••••••••" required>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-primary" id="btnSubmit">
                        <span>Créer mon compte d'accès 🔒</span>
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-dim); font-size: 0.9rem;">
                    Vous avez déjà un compte ? 
                    <a href="index.html" style="color: var(--primary-hover); text-decoration: none; font-weight: 600;">Connectez-vous</a>
                </p>
            </div>
        </div>
    </div>
</main>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const prenom = document.getElementById('prenom').value;
        const nom = document.getElementById('nom').value;
        const email = document.getElementById('email').value;
        const motdepass = document.getElementById('motdepass').value;
        const motdepassconfirm = document.getElementById('motdepassconfirm').value;

        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (motdepass !== motdepassconfirm) {
            errorMsg.style.display = 'flex';
            errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>Création en cours...</span>';

        try {
            const res = await fetch('/api/utilisateur', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prenom, nom, email, motdepass, motdepassconfirm })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                successMsg.style.display = 'flex';
                successMsg.textContent = 'Compte créé avec succès ! Redirection vers la connexion...';
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                errorMsg.style.display = 'flex';
                errorMsg.textContent = data.message || 'Erreur lors de la création du compte.';
            }
        } catch (err) {
            errorMsg.style.display = 'flex';
            errorMsg.textContent = 'Erreur serveur : ' + err.message;
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<span>Créer mon compte d\'accès 🔒</span>';
        }
    });
</script>
</body>
</html>
