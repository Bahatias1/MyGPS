<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage des Enfants - SYSLOC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2><strong>SYSLOC</strong></h2>
    <a href="enregistrerEnfant.html">Ajouter</a>
    <a href="afficherEnfants.html">Afficher</a>
    <a href="index.html">Déconnexion</a>
</header>

<div class="formEn" style="margin-top: 3%;">
    <h2 style="text-align: center;">Liste des enfants enregistrés</h2>
    <div class="table-container">
        <table class="tableAff" style="margin:auto; border-collapse: collapse;" border="1">
            <thead>
                <tr class="mesth">
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Post-Nom</th>
                    <th>Prénom</th>
                    <th>Âge</th>
                    <th>Classe</th>
                    <th>Opérations</th>
                </tr>
            </thead>
            <tbody id="childrenTableBody">
                <tr><td colspan="7">Chargement des données...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadChildren() {
        const tbody = document.getElementById('childrenTableBody');
        try {
            const res = await fetch('/api/afficherEnfants');
            const data = await res.json();

            if (data && data.length > 0) {
                tbody.innerHTML = data.map(item => `
                    <tr class="mestd">
                        <td>${item.idEnfant}</td>
                        <td>${item.nom}</td>
                        <td>${item.postNom}</td>
                        <td>${item.prenom}</td>
                        <td>${item.age}</td>
                        <td>${item.classe}</td>
                        <td>
                            <div class="operation">
                                <a href="localiser.html?id=${item.idEnfant}" class="btn-action">Suivre</a>
                                <button onclick="deleteChild(${item.idEnfant})">Effacer</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="7">Aucun enfant trouvé dans la base de données.</td></tr>`;
            }
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="7" style="color:red;">Erreur de chargement : ${err.message}</td></tr>`;
        }
    }

    async function deleteChild(idEnfant) {
        if (!confirm("Êtes-vous sûr de vouloir supprimer les informations de cet enfant ?")) return;
        try {
            const res = await fetch('/api/supprimerEnfant', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idEnfant })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message || "Enfant supprimé avec succès.");
                loadChildren();
            } else {
                alert(data.message || "Erreur lors de la suppression.");
            }
        } catch (err) {
            alert("Erreur serveur : " + err.message);
        }
    }

    window.onload = loadChildren;
</script>
</body>
</html>
