<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholaGuard Maternelle - Portail de Surveillance Scolaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-container">
        <a href="index.html" class="logo">
            <span>🏫 ScholaGuard</span>
            <span class="logo-badge">ÉCOLE MATERNELLE</span>
        </a>
        <nav>
            <a href="index.html" class="active">Connexion</a>
            <a href="utilisateur.html">Créer un Compte</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <div class="form-card-wrapper">
        <div class="card-minimal">
            <div class="form-header">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎒</div>
                <h2>Portail École Maternelle</h2>
                <p>Système de surveillance & géolocalisation des élèves en temps réel</p>
            </div>

            <div id="errorMsg" class="alert alert-error" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Adresse Email Pro / Parent</label>
                    <input type="email" id="email" name="email" placeholder="directeur@ecole-maternelle.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="motdepass">Mot de passe</label>
                    <input type="password" id="motdepass" name="motdepass" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-primary" id="btnSubmit">
                        <span>Accéder à l'Espace de Surveillance 🔒</span>
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <p style="color: var(--text-dim); font-size: 0.9rem;">
                    Nouveau compte (Enseignant / Direction / Parent) ? 
                    <a href="utilisateur.html" style="color: var(--primary-hover); text-decoration: none; font-weight: 600;">Inscrivez-vous ici</a>
                </p>
            </div>
        </div>
    </div>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const motdepass = document.getElementById('motdepass').value;
        const errorMsg = document.getElementById('errorMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        errorMsg.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>Connexion en cours...</span>';

        try {
            const res = await fetch('/api/autentification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, motdepass })
            });

            const data = await res.json();

            if (res.ok && data.success === true) {
                window.location.href = 'afficherEnfants.html';
            } else {
                errorMsg.style.display = 'flex';
                errorMsg.textContent = data.message || 'Identifiants incorrects.';
            }
        } catch (err) {
            errorMsg.style.display = 'flex';
            errorMsg.textContent = 'Erreur serveur : ' + err.message;
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<span>Se connecter</span>';
        }
    });
</script>
</body>
</html>
